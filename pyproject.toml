[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vinted-panel"
version = "0.1.0"
description = "Panel longitudinal de precios en Vinted (TFM)"
readme = "CLAUDE.md"
requires-python = ">=3.11"
dependencies = [
    "curl_cffi>=0.7",
    "pandas>=2.1",
    "pyarrow>=15",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
